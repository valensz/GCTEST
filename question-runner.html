<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Question Runner</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-default">
  <div class="app-container">
    <header class="app-header">
      <div class="logo">
        <i class="fa-solid fa-vial logo-icon"></i>
        <span class="logo-text">Question Runner</span>
      </div>
      <div class="header-actions">
        <a href="index.html" class="btn btn-secondary">
          <i class="fa-solid fa-arrow-left"></i> Back to Quiz
        </a>
      </div>
    </header>

    <main class="main-content">
      <section class="screen active">
        <div class="glass-card history-card" style="max-width: 900px; margin: 0 auto;">
          <h2>Admin Test Mode</h2>
          <p class="history-subtitle">Load a specific question from the cached database and answer it individually.</p>

          <div class="controls" style="margin-top: 20px; gap: 12px; align-items: center; flex-wrap: wrap;">
            <label>Question # <input type="number" id="q-number" min="1" value="1"></label>
            <button id="run-q-btn" class="btn btn-primary">Load Question</button>
            <button id="clear-runner-btn" class="btn">Reset</button>
            <span id="runner-status" class="status">Loaded questions: <strong id="runner-count">0</strong> (source: <strong id="runner-source">—</strong>)</span>
          </div>
          <div id="runner-message" class="status" style="margin-top: 10px; min-height: 1.2em;"></div>

          <div class="question-area" id="question-area" style="display:none; margin-top: 24px;">
            <h4 id="q-title"></h4>
            <div id="multi-hint" class="status" style="margin-bottom: 10px; display:none;"></div>
            <div id="q-body" style="white-space: pre-wrap; line-height: 1.6;"></div>
            <button id="show-image-btn" class="btn btn-secondary" style="display:none; margin-top: 12px;">
              <i class="fa-solid fa-image"></i> Show Reference Image
            </button>
            <div class="option-list" id="option-list"></div>
            <!-- Validation happens on selection: single-choice at the first click, multi-choice once the required count is picked -->
            <div id="check-result" class="status" style="margin-top:12px;"></div>
          </div>

          <div id="image-popup-overlay" class="image-popup-overlay" style="display:none;">
            <div class="image-popup-card">
              <button id="close-image-popup" class="btn btn-link close-image-btn">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <div class="popup-title">Reference Image for <span id="image-popup-question-id"></span></div>
              <img id="question-image-preview" src="about:blank" alt="Question reference image" />
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="text-utils.js"></script>
  <script src="image-utils.js"></script>
  <script>
    // Id of the question currently on screen; async image lookups for other questions are ignored
    let activeQuestionId = null;

    function loadCachedQuestions() {
      const countEl = document.getElementById('runner-count');
      const sourceEl = document.getElementById('runner-source');
      try {
        const cached = localStorage.getItem('gcp_questions_db');
        if (!cached) {
          countEl.textContent = '0';
          sourceEl.textContent = '—';
          return null;
        }
        const questions = sanitizeQuestions(JSON.parse(cached));
        countEl.textContent = String(questions.length);
        sourceEl.textContent = localStorage.getItem('gcp_db_source') || 'kahoot.pdf';
        return questions;
      } catch (e) {
        countEl.textContent = '0';
        sourceEl.textContent = '—';
        return null;
      }
    }

    function renderQuestion(q) {
      activeQuestionId = q.id;
      const imageBtn = document.getElementById('show-image-btn');
      imageBtn.style.display = 'none';
      imageBtn.disabled = true;
      imageBtn.onclick = null;

      document.getElementById('question-area').style.display = 'block';
      document.getElementById('q-title').textContent = `Q#${q.id}`;
      document.getElementById('q-body').textContent = q.question || '';
      document.getElementById('check-result').textContent = '';

      const letters = Object.keys(q.options).sort();
      const rule = getSelectionRule(q.question, letters.length);

      const hintEl = document.getElementById('multi-hint');
      hintEl.textContent = rule.isMultiple ? `Select ${rule.required} option${rule.required > 1 ? 's' : ''}` : '';
      hintEl.style.display = rule.isMultiple ? 'block' : 'none';

      const list = document.getElementById('option-list');
      list.innerHTML = '';
      const picked = new Set();
      letters.forEach(letter => {
        const btn = document.createElement('button');
        btn.className = 'answer-card';
        btn.style.width = '100%';
        btn.dataset.option = letter;
        const label = document.createElement('strong');
        label.textContent = `${letter}.`;
        btn.append(label, ` ${q.options[letter]}`);

        btn.addEventListener('click', () => {
          if (!rule.isMultiple) {
            validateAnswer(q, [letter]);
            return;
          }
          if (picked.has(letter)) {
            picked.delete(letter);
            btn.classList.remove('multi-selected');
          } else {
            if (picked.size >= rule.required) return; // no more than the required count
            picked.add(letter);
            btn.classList.add('multi-selected');
          }
          if (picked.size === rule.required) validateAnswer(q, [...picked]);
        });
        list.appendChild(btn);
      });

      resolveReferenceImageUrl(q.id).then(url => {
        if (!url || activeQuestionId !== q.id) return;
        imageBtn.style.display = 'inline-flex';
        imageBtn.disabled = false;
        imageBtn.onclick = () => openImagePopup(url, q.id);
      });
    }

    // Marks correct options green, wrong selections red, and locks the question
    function validateAnswer(q, selectedLetters) {
      const selected = selectedLetters.map(s => String(s).toUpperCase());
      const correct = String(q.answer || '').toUpperCase().match(/[A-Z]/g) || [];
      const isCorrect = selected.length > 0 && selected.length === correct.length &&
        correct.every(c => selected.includes(c));

      document.querySelectorAll('#option-list .answer-card').forEach(btn => {
        const opt = btn.dataset.option;
        btn.classList.remove('multi-selected');
        if (correct.includes(opt)) {
          btn.classList.add('correct-answer-highlight');
        } else if (selected.includes(opt)) {
          btn.classList.add('wrong-answer-highlight');
        } else {
          btn.classList.add('fade-out');
        }
        btn.disabled = true;
      });

      document.getElementById('check-result').textContent =
        isCorrect ? `Correct! Answer: ${q.answer}` : `Incorrect. Correct: ${q.answer}`;
    }

    function openImagePopup(url, id) {
      const overlay = document.getElementById('image-popup-overlay');
      const preview = document.getElementById('question-image-preview');
      preview.src = url;
      preview.alt = `Reference image for question ${id}`;
      document.getElementById('image-popup-question-id').textContent = `Q#${id}`;
      overlay.style.display = 'flex';
      requestAnimationFrame(() => overlay.classList.add('active'));
    }

    function closeImagePopup() {
      const overlay = document.getElementById('image-popup-overlay');
      overlay.classList.remove('active');
      setTimeout(() => {
        overlay.style.display = 'none';
        document.getElementById('question-image-preview').src = 'about:blank';
      }, 220);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedTheme = localStorage.getItem('gcp_theme') || 'default';
      document.body.classList.remove('dark-theme');
      document.body.classList.add(`theme-${savedTheme}`);

      const messageEl = document.getElementById('runner-message');
      if (!loadCachedQuestions()) {
        messageEl.textContent = 'No cached database found. Upload a PDF in admin or on the main app first.';
      }

      document.getElementById('run-q-btn').addEventListener('click', () => {
        const loaded = loadCachedQuestions();
        if (!loaded) {
          messageEl.textContent = 'No cached DB available.';
          return;
        }
        const idx = parseInt(document.getElementById('q-number').value, 10);
        if (!idx || idx < 1 || idx > loaded.length) {
          messageEl.textContent = 'Invalid question number.';
          return;
        }
        const q = loaded.find(x => x.id === idx) || loaded[idx - 1];
        if (!q) {
          messageEl.textContent = 'Question not found.';
          return;
        }
        messageEl.textContent = `Loaded question ${q.id}`;
        renderQuestion(q);
      });

      document.getElementById('clear-runner-btn').addEventListener('click', () => {
        activeQuestionId = null;
        document.getElementById('question-area').style.display = 'none';
        document.getElementById('option-list').innerHTML = '';
        document.getElementById('check-result').textContent = '';
        messageEl.textContent = 'Ready. Load a question number from the cached DB.';
      });

      const overlay = document.getElementById('image-popup-overlay');
      overlay.addEventListener('click', event => {
        if (event.target === overlay) closeImagePopup();
      });
      document.getElementById('close-image-popup').addEventListener('click', closeImagePopup);
    });
  </script>
</body>
</html>
